@if (pageCount() > 1) {
<nav class="pagination" aria-label="Pages">
  <button type="button" (click)="go(page() - 1)" [disabled]="page() === 1">Previous</button>
  <span>{{ page() }} / {{ pageCount() }}</span>
  <button type="button" (click)="go(page() + 1)" [disabled]="page() === pageCount()">Next</button>
</nav>
}
