@switch (page()) {
  @case ("projects") {
    <app-project-control-panel></app-project-control-panel>
  }
  @case ("posts") {
    <div class="filters">
      <label class="filter">
        <span>Category</span>
        <app-select-field label="Category" [options]="categoryOptions()" [value]="posts.selectedCategory()" (valueChange)="posts.selectedCategory.set($event)"></app-select-field>
      </label>
      <label class="filter">
        <span>Tag</span>
        <app-select-field label="Tag" [options]="tagOptions()" [value]="posts.selectedTag()" (valueChange)="posts.selectedTag.set($event)"></app-select-field>
      </label>
      <label class="filter">
        <span>Sort</span>
        <app-select-field label="Sort" [options]="sortOptions" [value]="posts.selectedSort()" (valueChange)="posts.selectedSort.set($event)"></app-select-field>
      </label>
    </div>
  }
}
