@switch (page()) {
  @case ("projects") {
    <app-project-control-panel></app-project-control-panel>
  }
  @case ("changelog") {
    <div class="filters">
      <app-dropdown label="Project" [selectedOption]="changelog.selectedProject()" [options]="changelog.projects()" (selectedOptionChange)="changelog.selectedProject.set($event)"></app-dropdown>
    </div>
  }
  @case ("posts") {
    <div class="filters">
      <app-dropdown label="Category" [selectedOption]="posts.selectedCategory()" [options]="posts.categories()" (selectedOptionChange)="posts.selectedCategory.set($event)"></app-dropdown>
      <app-dropdown label="Tag" [selectedOption]="posts.selectedTag()" [options]="posts.tags()" (selectedOptionChange)="posts.selectedTag.set($event)"></app-dropdown>
      <app-dropdown label="Sort" [selectedOption]="posts.selectedSort()" [options]="posts.sorts" (selectedOptionChange)="posts.selectedSort.set($event)"></app-dropdown>
    </div>
  }
}
