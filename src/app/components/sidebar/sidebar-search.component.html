<div class="search">
  <input type="search" class="search-input" [placeholder]="scope() === 'project' ? 'Search projects' : 'Search posts'" [value]="query()" (input)="onInput($event)" [attr.aria-label]="scope() === 'project' ? 'Search projects' : 'Search posts'" autocomplete="off" />

  @if (query().trim()) {
  <ul class="results">
    @for (result of results(); track result.link) {
    <li>
      <a class="result" [routerLink]="result.link" (click)="query.set('')">
        <span class="result-kind">{{ result.kind }}</span>
        <span class="result-title">{{ result.title }}</span>
      </a>
    </li>
    } @empty {
    <li class="result-empty">No matches</li>
    }
  </ul>
  }
</div>
