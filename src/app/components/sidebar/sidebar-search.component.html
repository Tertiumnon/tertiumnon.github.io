<div class="search">
  <app-text-field type="search" [label]="scope() === 'project' ? 'Search projects' : 'Search posts'" [placeholder]="scope() === 'project' ? 'Search projects' : 'Search posts'" [value]="query()" (valueChange)="query.set($event)"></app-text-field>

  @if (query().trim()) {
  <ul class="results">
    @for (result of results(); track result.link) {
    <li>
      <a class="result" [routerLink]="result.link" (click)="query.set('')">
        <span class="result-kind">{{ result.kind }}</span>
        <span class="result-title">{{ result.title }}</span>
      </a>
    </li>
    } @empty {
    <li class="result-empty">No matches</li>
    }
  </ul>
  }
</div>
