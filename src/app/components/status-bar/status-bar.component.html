<footer class="status-bar">
  <button type="button" class="terminal-toggle" (click)="terminal.toggle()" [attr.aria-pressed]="terminal.open()">Terminal</button>
  <div class="status-controls">
    <app-select-field class="font-switch" label="Font" [options]="fontChoices" [formControl]="fontCtrl"></app-select-field>
    <app-select-field class="theme-switch" label="Theme" [options]="themeChoices" [formControl]="themeCtrl"></app-select-field>
  </div>
</footer>
