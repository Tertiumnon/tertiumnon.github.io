<footer class="status-bar">
  <button type="button" class="terminal-toggle" (click)="terminal.toggle()" [attr.aria-pressed]="terminal.open()">Terminal</button>
  <div class="status-controls">
    <label class="font-switch">
      <span class="visually-hidden">Font</span>
      <select [formControl]="fontCtrl">
        @for (font of fontService.fonts; track font) {
        <option [value]="font">{{ fontOptions[font].label }}</option>
        }
      </select>
    </label>
    <label class="theme-switch">
      <span class="visually-hidden">Code theme</span>
      <select [formControl]="codeThemeCtrl">
        <option value="same">Code: same as theme</option>
        @for (theme of themeService.themes; track $index) {
        <option [value]="theme">Code: {{ themeLabels[theme] }}</option>
        }
      </select>
    </label>
    <label class="theme-switch">
      <span class="visually-hidden">Theme</span>
      <select [formControl]="themeCtrl">
        @for (theme of themeService.themes; track $index) {
        <option [value]="theme">{{ themeLabels[theme] }}</option>
        }
      </select>
    </label>
  </div>
</footer>
