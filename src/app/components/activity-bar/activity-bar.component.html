<a class="logo-mark" routerLink="/index" (click)="onLogoClick()" [class.animating]="isAnimating()" aria-label="Home">
  <span class="progress-bar--column" [class.animate]="isAnimating()"></span>
  <span class="progress-bar--column" [class.animate]="isAnimating()"></span>
  <span class="progress-bar--column" [class.animate]="isAnimating()"></span>
</a>

<nav class="activity-items">
  @for (item of items; track item.label) {
  <a class="activity-item" [routerLink]="item.link" routerLinkActive="active" [title]="item.label" [attr.aria-label]="item.label">
    @switch (item.icon) {
      @case ("projects") { <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg> }
      @case ("changelog") { <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" /></svg> }
      @case ("posts") { <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z" /><path d="M9 11h6M9 15h6" /></svg> }
      @case ("tools") { <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg> }
      @case ("about-me") { <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg> }
    }
  </a>
  }
</nav>
