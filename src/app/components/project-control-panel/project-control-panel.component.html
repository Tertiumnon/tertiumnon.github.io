<div class="project-control-panel">
  <div class="container-fluid panel-bar">
    <div class="filters">
      <app-dropdown
        label="Status"
        [(selectedOption)]="status"
        [options]="statusOptions"
        (selectedOptionChange)="onStatusChange($event)"
      ></app-dropdown>
      <app-dropdown
        label="License"
        [selectedOption]="license"
        [options]="licenseOptions"
        (selectedOptionChange)="onLicenseChange($event)"
      ></app-dropdown>
      <app-dropdown
        label="Release"
        [(selectedOption)]="release"
        [options]="releaseOptions"
        (selectedOptionChange)="onReleaseChange($event)"
      ></app-dropdown>
    </div>
  </div>
</div>
