<div class="container-fluid changelog-page" style="margin-top: var(--container-margin-top);">
  <app-page-header title="Changelog">
    <app-sidebar-page-filters></app-sidebar-page-filters>
  </app-page-header>

  <ol class="changelog-feed">
    @for (changelogItem of filteredChangelog(); track changelogItem.link) {
    <li class="changelog-item">
      <time class="changelog-date">{{ changelogItem.publishedAt }}</time>
      <span class="changelog-rail" aria-hidden="true"></span>
      <div class="changelog-entry">
        @if (changelogItem.content) {
        <app-md-content [data]="changelogItem.content"></app-md-content>
        }
      </div>
    </li>
    }
  </ol>
</div>
