<div class="home-page">
  <app-arcade-cabinet title="Tertium Arcade">
    <app-game-stage screen>
      @switch (game()) {
      @case ("catch") {
      <app-honey-catch></app-honey-catch>
      }
      @case ("hello") {
      <app-hello-world-game></app-hello-world-game>
      }
      }
    </app-game-stage>
    <nav controls class="game-switch" aria-label="Games">
      @for (item of games; track item.key) {
      <button type="button" [class.active]="game() === item.key" [attr.aria-pressed]="game() === item.key" (click)="game.set(item.key)">{{ item.label }}</button>
      }
    </nav>
  </app-arcade-cabinet>
</div>
