<app-page-header title="Posts">
  <app-sidebar-page-filters></app-sidebar-page-filters>
</app-page-header>
<div class="container-fluid posts-page" style="margin-top: 0.5rem;">

  @if (sortedPosts().length === 0) {
  <p class="no-posts-message">No posts available.</p>
  } @else {
  <ol class="post-list">
    @for (article of pagedPosts(); track article.link) {
    <li class="post-row">
      <time class="post-date">{{ article.publishedAt }}</time>
      <span class="post-category">{{ getCategoryDisplay(article.category) }}</span>
      <a class="post-title" [routerLink]="getPostLink(article.link)">{{ article.title }}</a>
    </li>
    }
  </ol>
  }
</div>
@if (pageCount() > 1) {
<nav class="pagination" aria-label="Posts pages">
  <button type="button" (click)="previousPage()" [disabled]="page() === 1">Previous</button>
  <span>{{ page() }} / {{ pageCount() }}</span>
  <button type="button" (click)="nextPage()" [disabled]="page() === pageCount()">Next</button>
</nav>
}
