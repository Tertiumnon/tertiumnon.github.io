<app-page-header title="Posts">
  <app-sidebar-page-filters></app-sidebar-page-filters>
</app-page-header>
<div class="container-fluid posts-page" style="margin-top: 0.5rem;">

  @if (sortedPosts().length === 0) {
  <p class="no-posts-message">No posts available.</p>
  } @else {
  <ol class="post-list">
    @for (article of visiblePosts(); track article.link) {
    <li class="post-row">
      <time class="post-date">{{ article.publishedAt }}</time>
      <div class="post-meta"><span class="post-category">{{ getCategoryDisplay(article.category) }}</span>@if (article.updatedAt) {<span class="post-updated">updated {{ article.updatedAt }}</span>}</div>
      <a class="post-title" [routerLink]="getPostLink(article.link)">{{ article.title }}</a>
    </li>
    }
  </ol>
  }
</div>
<app-load-more [hasMore]="visibleCount() < sortedPosts().length" (reached)="loadMore()"></app-load-more>
