name: Build and deploy to GitHub Pages

# Builds and deploys what is committed. Generated data is built locally (see the pre-push hook)
# and refreshed remotely only by refresh-generated.yml, so this workflow never pushes changes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build site (dist/gh-pages/)
        run: |
          bun run gh:pages:build

      - name: Verify .nojekyll exists
        run: |
          ls -la dist/gh-pages/ | grep -E "(^d|nojekyll|index)"
          test -f dist/gh-pages/.nojekyll && echo ".nojekyll file exists" || echo "ERROR: .nojekyll file not found"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
